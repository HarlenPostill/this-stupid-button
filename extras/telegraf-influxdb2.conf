# Optional starting point only: adapt to your course's InfluxDB 2.x instance.
# Run with INFLUX_TOKEN set in the environment; never commit an actual token.
[agent]
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.emqx.io:1883"]
  topics = ["iot2026/harlen-group01/fire/status"]
  client_id = "harlen-group01-telegraf"
  username = "emqx"
  password = "public"
  qos = 0
  persistent_session = false
  name_override = "fire_alarm"
  data_format = "json"
  tag_keys = ["group", "device"]
  json_string_fields = ["state", "ack_source", "alarm_id"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "YOUR_ORGANISATION"
  bucket = "YOUR_BUCKET"
