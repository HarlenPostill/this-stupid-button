<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { margin:0; background:var(--background); color:var(--foreground); font-family:var(--font-sans,system-ui); }
#environment-monitor .circuits { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
#environment-monitor svg { width:100%; height:258px; display:block; }
#environment-monitor svg text { fill:var(--foreground); font-family:inherit; font-size:14px; }
#environment-monitor .inputs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 24px; }
#environment-monitor label { display:block; }
#environment-monitor input { width:100%; box-sizing:border-box; margin:0; }
#environment-monitor .result { margin:20px 0 6px; font-weight:500; }
#environment-monitor .flow { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 24px; color:var(--muted-foreground); }
#environment-monitor h3 { font-weight:500; margin:12px 0; }
@media(max-width:540px) { #environment-monitor .circuits,#environment-monitor .inputs { grid-template-columns:1fr; } }
</style></head>
<body><div id="environment-monitor">
<div class="circuits">
<section><h3>Temperature · GPIO34</h3><svg id="temp-circuit" role="img" aria-label="3.3 volts through a fixed 10 kiloohm resistor to GPIO34 junction, then through the thermistor to ground"></svg></section>
<section><h3>Light · GPIO35</h3><svg id="light-circuit" role="img" aria-label="3.3 volts through a photoresistor to GPIO35 junction, then through a fixed 10 kiloohm resistor to ground"></svg></section>
</div>
<div class="flow"><span>ADC1 · sample every 1 s</span><span>→</span><span>Classify + UTC sample time</span><span>→</span><span>HTTPS upload ≥15 s</span><span>→</span><span>InfluxDB bucket → Data Explorer</span></div>
<h3>Practise status predictions · simulated values</h3>
<div class="inputs">
<label class="form-label">Temperature <output id="temperature-value">29.0 °C</output><input class="form-range" id="temperature" type="range" min="15" max="40" step="0.1" value="29"></label>
<label class="form-label">Relative light <output id="light-value">20.0%</output><input class="form-range" id="light" type="range" min="0" max="100" step="0.1" value="20"></label>
<label class="form-label" for="hot">HOT threshold (°C)<input class="form-control" id="hot" type="number" min="-10" max="80" step="0.1" value="30"></label>
<label class="form-label" for="dark">DARK threshold (%)<input class="form-control" id="dark" type="number" min="0" max="100" step="0.1" value="25"></label>
</div>
<div class="result" aria-live="polite"><span id="state">DARK</span> · <span id="decision">29.0 °C ≤ 30.0 °C; 20.0% &lt; 25.0%</span></div>
<div class="text-small text-muted">Simulator only · actual readings appear in your InfluxDB account</div>
</div>
<script>
(()=>{
const root=document.getElementById('environment-monitor');
const q=id=>root.querySelector('#'+id);
function circuit(id,upper,lower,pin){
 const svg=q(id), width=svg.getBoundingClientRect().width, x=Math.max(64,width*.26);
 svg.setAttribute('viewBox',`0 0 ${width} 258`);
 svg.innerHTML=`<g stroke="var(--foreground)" stroke-width="1.5" fill="none"><path d="M${x} 34 V52 M${x} 94 V126 M${x} 126 V154 M${x} 196 V226 M${x} 126 H${width-25}"/><rect x="${x-18}" y="52" width="36" height="42"/><rect x="${x-18}" y="154" width="36" height="42"/></g><circle cx="${x}" cy="126" r="4" fill="var(--foreground)"/><text x="${x}" y="23" text-anchor="middle">ESP32 3V3</text><text x="${x+28}" y="77">${upper}</text><text x="${x+28}" y="176">${lower}</text><text x="${width-25}" y="115" text-anchor="end">${pin}</text><text x="${x}" y="247" text-anchor="middle">ESP32 GND</text>`;
}
function draw(){circuit('temp-circuit','Fixed 10 kΩ','NTC 10 kΩ','GPIO34');circuit('light-circuit','Photoresistor','Fixed 10 kΩ','GPIO35');}
function update(save=false){
 const t=Number(q('temperature').value),l=Number(q('light').value),h=Number(q('hot').value),d=Number(q('dark').value);
 q('temperature-value').value=t.toFixed(1)+' °C';q('light-value').value=l.toFixed(1)+'%';
 if(q('hot').value===''||q('dark').value===''||h < -10||h>80||d<0||d>100){q('state').textContent='Invalid threshold';q('decision').textContent='HOT: −10 to 80 °C · DARK: 0 to 100%';return;}
 const hot=t>h,dark=l<d;
 q('state').textContent=hot?(dark?'HOT & DARK':'HOT'):(dark?'DARK':'NORMAL');
 q('decision').textContent=`${t.toFixed(1)} °C ${hot?'>':'≤'} ${h.toFixed(1)} °C; ${l.toFixed(1)}% ${dark?'<':'≥'} ${d.toFixed(1)}%`;
 if(save && window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{temperature:t,light:l,hotThreshold:h,darkThreshold:d},privateContent:null}).catch(()=>{});
}
const saved=window.openai?.widgetState?.modelContent;
if(saved) for(const [id,key] of [['temperature','temperature'],['light','light'],['hot','hotThreshold'],['dark','darkThreshold']]) if(Number.isFinite(saved[key]))q(id).value=saved[key];
for(const id of ['temperature','light','hot','dark'])q(id).addEventListener('input',()=>update(true));
window.addEventListener('openai:set_globals',event=>{
 const s=event.detail?.globals?.widgetState?.modelContent;
 if(s){for(const [id,key] of [['temperature','temperature'],['light','light'],['hot','hotThreshold'],['dark','darkThreshold']])if(Number.isFinite(s[key]))q(id).value=s[key];update();}
});
new ResizeObserver(draw).observe(root);draw();update();
})();
</script></body></html>
