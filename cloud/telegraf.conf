# Required chain: ESP32 -> EMQX MQTT -> Telegraf -> existing lab InfluxDB 2.x.
# Telegraf timestamps at receipt. Only fresh, unretained telemetry is ingested.
[agent]
  flush_interval = "5s"
  metric_batch_size = 100
  metric_buffer_limit = 10000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.emqx.io:1883"]
  topics = ["iot2026/${LAB_GROUP_ID}/noise/+/telemetry"]
  client_id = "${LAB_GROUP_ID}-noise-telegraf"
  username = "emqx"
  password = "public"
  qos = 0
  persistent_session = false
  connection_timeout = "5s"
  topic_tag = ""
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "noise_monitor"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "group"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "location"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "estimated_spl_db"
      type = "float"
      optional = true # Omitted on mic fault; never substitute 0 dB.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dbfs"
      type = "float"
      optional = true # Omitted on mic fault; never substitute 0 dB.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "state_code"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sensor_ok"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "clipped"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "calibrated"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "warning_db"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "limit_db"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "offset_db"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hysteresis_db"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sequence"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sample_age_ms"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_ms"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "window_ms"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sample_rate_hz"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi_dbm"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "boot_id"
      type = "string"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "firmware"
      type = "string"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
