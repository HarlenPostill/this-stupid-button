apiVersion: 1
datasources:
  - name: Noise InfluxDB
    uid: noise-influx
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
    secureJsonData:
      token: $INFLUX_READ_TOKEN
